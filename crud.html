<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pedro Dias de Souza">
    <meta property="og:title" content="Editor de comentários">
    <meta property="og:description" content="...">
    <meta property="og:url" content="https://teatromunicipaldoriogrande.com">

    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Editor de comentários</title>
</head>

<body>
    <meu-header id="Bem-vindo"></meu-header>

    <h1>Gerenciador de comentários:</h1>

    <div id="mensagem">Escolha uma notícia para editar.</div>
    
    <form id="noticiaForm" class="oculto">    
        <input type="hidden" id="noticiaId">
        <input type="text" id="noticiaTitle" placeholder="Título da notícia" required>
        <textarea id="noticiaBody" placeholder="Conteúdo da notícia" rows="3" required></textarea>
        <button type="submit" id="submitBtn">Alterar notícia</button>
    </form>

    <div id="noticiasContainer"></div>
    
    <script src="script.js"></script>

</body>
</html>















    <style>
        form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; }
        input, textarea, button { padding: 8px; font-size: 16px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; }
        button:hover { background-color: #0056b3; }
        .noticia-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; }
        .actions { margin-top: 10px; }
        .btn-edit { background-color: #ffc107; color: black; margin-right: 5px; }
        #mensagem { margin-bottom: 10px; color: green; font-weight: bold; }
        .oculto { display: none; }
    </style>
