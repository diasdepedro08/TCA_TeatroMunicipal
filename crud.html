<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pedro Dias de Souza">
    <meta property="og:title" content="Editor de comentários">
    <meta property="og:description" content="...">
    <meta property="og:url" content="https://teatromunicipaldoriogrande.com">

    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Gerenciador de comentários</title>
</head>

<body>
    <meu-header id="Bem-vindo"></meu-header>

    <main>
    <fieldset>
    <legend><h1>Gerenciador de comentários:</h1></legend>
    
    <form id="comentarios" class="oculto">
        <h2>Editor:</h2>
        <div id="mensagem">Escolha uma notícia para editar.</div>

        <input type="hidden" id="comentID">

        <input type="text" name="nome" id="name" required>

        <textarea name="comentario" id="coment" required></textarea>

        <button type="submit" id="submitBtn">Alterar notícia</button>
        <button type="submit" id="cancelBTN">Cancelar</button>
    </form>

    <div id="noticiasContainer"></div>
    </fieldset>
    </main>
    
    <meu-footer></meu-footer>
    
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/customelements.js"></script>
</body>
</html>
