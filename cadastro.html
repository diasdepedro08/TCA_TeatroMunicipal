<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">

    <meta property="og:title" content="Ocupa Teatro Municipal">
    <meta property="og:description" content="...">
    <meta property="og:url" content="https://teatromunicipaldoriogrande.com">

    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Inscrições para Ocupação do Teatro</title>
</head>

<body>
    <meu-header id="Bem-vindo"></meu-header>
    <script src="script.js"></script>

    <p>Formulário de inscrição para ocupação Teatro Municipal com os editais Ocupa Teatro Municipal</p>

    <form>
        <h1>Espetáculo</h1>

        <fieldset>
            <label for="titulo">Titulo da Proposta:</label>
            <input type="text" placeholder="Titulo:" id="titulo" required>

            <label for="coletivo">Nome do grupo:</label>
            <input type="text" placeholder="Coletivos, escolas, etc." id="titulo" required>

            <label for="duracao">Tempo da Sessão:</label>
            <input type="number" placeholder="Ex: 90 min" id="duracao">

            <label for="sinopse">Sinopse:</label>
            <textarea name="Sinopse" id="sinopse"></textarea>
        </fieldset>

        <h1>Ficha Técnica:</h1>

        <fieldset>
            <label for="direcao">Direção:</label>
            <input type="text" placeholder="Diretor:" id="direcao">

            <label for="iluminacao">Iluminação:</label>
            <input type="text" placeholder="Iluminador:" id="iluminacao">

            <label for="sonoplastia">Sonoplastia:</label>
            <input type="text" placeholder="Sonoplasta:" id="sonoplastia" required>

            <label for="cenografia">Cenografia:</label>
            <input type="text" placeholder="Cenógrafo:" id="cenografia" required>

            <label for="figurino">Figurino:</label>
            <input type="text" placeholder="Figurinista:" id="figurino" required>

            <label for="maquiagem">Caracterização:</label>
            <input type="text" placeholder="Maquiador:" id="maquiagem" required>
        </fieldset>

    </form>







</body>
</html>
