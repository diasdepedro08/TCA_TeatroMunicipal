<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pedro Dias de Souza">
    <meta property="og:title" content="Ocupa Teatro Municipal">
    <meta property="og:description" content="...">
    <meta property="og:url" content="https://teatromunicipaldoriogrande.com">

    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css" integrity="sha512-q6WgHqiHlKyOqslT/lgBgodhd03Wp4BEqKeW6nNtlOY4quzyG3VoQKFrieaCeSnuVseNKRGpGeDU3qPmabCANg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Inscrições para Ocupação do Teatro</title>
</head>

<body>
    <meu-header id="Bem-vindo"></meu-header>
    <img src="img/ocupa_banner.png" alt="ocupa_banner" id="banner">

    <p>Formulário de inscrição para ocupação Teatro Municipal com os editais Ocupa Teatro Municipal.</p>
    <p>Links de Edital e aqeulas coisinhas</p>

    <form>

        <fieldset>
            <legend><h1>Espetáculo:</h1></legend>

            <label for="titulo">Titulo da Proposta:
                <input type="text" placeholder="Titulo:" id="titulo" required>
            </label>
            

            <label for="coletivo">Nome do grupo:
                <input type="text" placeholder="Coletivos, escolas, etc." id="titulo" required>
            </label>
            

            <label for="duracao">Tempo da Sessão:
                <input type="number" placeholder="Ex: 90 min" id="duracao">
            </label>
            

            <label>Classificação indicativa:
                <fieldset id="indicativa">
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Livre para todos os públicos</p>
                    </label>
                    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 6 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 10 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 14 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 16 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 18 anos</p>
                    </label>
                </fieldset>
            </label>
            
            <label for="sinopse">Sinopse:
                <textarea name="Sinopse" id="sinopse"></textarea>
            </label>
            
        </fieldset>

        <fieldset>
            <legend><h1>Ficha Técnica:</h1></legend>
            
            <label for="direcao">Direção:
                <input type="text" placeholder="Diretor:" id="direcao">
            </label>
            

            <label for="iluminacao">Iluminação:
                <input type="text" placeholder="Iluminador:" id="iluminacao">
            </label>
            

            <label for="sonoplastia">Sonoplastia:
                <input type="text" placeholder="Sonoplasta:" id="sonoplastia" required>
            </label>
            

            <label for="cenografia">Cenografia:
                <input type="text" placeholder="Cenógrafo:" id="cenografia" required>
            </label>
            

            <label for="figurino">Figurino:
                <input type="text" placeholder="Figurinista:" id="figurino" required>
            </label>
            

            <label for="maquiagem">Caracterização:
                <input type="text" placeholder="Maquiador:" id="maquiagem" required>
            </label>
            
        </fieldset>

    </form>

    <meu-footer></meu-footer>

    <script src="script.js"></script>

</body>
</html>
