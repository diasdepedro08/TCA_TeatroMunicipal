<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Pedro Dias de Souza">
    <meta property="og:title" content="Ocupa Teatro Municipal">
    <meta property="og:description" content="...">
    <meta property="og:url" content="https://teatromunicipaldoriogrande.com">

    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon">

    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Formulário - Ocupa Teatro Municipal</title>
</head>

<body>
    <meu-header id="Bem-vindo"></meu-header>

    <nav>
        <img src="img/ocupa_banner.png" alt="ocupa_banner" id="banner">
        <p>Formulário de inscrição para ocupação Teatro Municipal com os editais Ocupa Teatro Municipal.</p>
        <p>Links de Edital e aqeulas coisinhas</p>
    </nav>

    <main>
    <form>

        <fieldset>
            <legend><h1>Proponente:</h1></legend>

            <label for="proponente">Nome do proponente:
                <input type="text" placeholder="Nome completo:" id="proponente" required>
            </label>

            <label for="cpf">CPF:
                <input type="text" placeholder="xxx.xxx.xxx-xx" id="cpf" required>
            </label>

            <label for="coletivo">Grupo(caso tenha):
                <input type="text" placeholder="Coletivos, escolas, etc." id="coletivo">
            </label>
        
            <label for="cnpj">CNPJ(caso tenha):
                <input type="text" placeholder="xxxx-xx" id="cnpj">
            </label>
            
            <label for="email">Email:
                <input type="email" placeholder="seuemail@xxx.com" id="email" required>
            </label>

            <label for="email">Telefone:
                <input type="tel" placeholder="+00 0000-0000" id="telefone" required>
            </label>

            <label>Inscrição como:
                <fieldset id="indicativa">
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Pessoa Física</p>
                    </label>
                    
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Pessoa Jurídica</p>
                    </label>
    
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Grupo coletivo sem CNPJ</p>
                    </label>
                </fieldset>
            </label>

            <label>Em caso de cotas, selecione abaixo:
                <fieldset id="indicativa">
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Negra</p>
                    </label>
                        
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Trans</p>
                    </label>
        
                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>Indigena</p>
                    </label>

                    <label>
                        <input type="radio" name="inscricao" id="inscricao">
                        <p>PCD</p>
                    </label>
                </fieldset>
            </label>

            <label for="curriculo">Currículo do Artista/Grupo/Coletivo proponente:
                <textarea name="Curriculo" id="curriculo" required></textarea>
            </label>

        </fieldset>

        <fieldset>
            <legend><h1>Proposta:</h1></legend>

            <label for="titulo">Título da Proposta:
                <input type="text" placeholder="Titulo:" id="titulo" required>
            </label>

            <label for="duracao">Duração:
                <input type="text" placeholder="Ex: 90 min" id="duracao" required>
            </label>

            <label>Classificação indicativa:
                <fieldset id="indicativa">
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Livre para todos os públicos</p>
                    </label>
                    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 6 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 10 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 12 anos</p>
                    </label>

                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 14 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 16 anos</p>
                    </label>
    
                    <label>
                        <input type="radio" name="publico" id="publico">
                        <p>Maiores de 18 anos</p>
                    </label>
                </fieldset>
            </label>
            
            <label for="sinopse">Sinopse:
                <textarea name="Sinopse" id="sinopse" required></textarea>
            </label>

            <label>Ficha da Equipe principal:
            <table id="tabelaequipe">
            <thead>
            <tr>
            <th class="col-num">#</th>
            <th><label>Nome</label></th>
            <th><label>Função</label></th>
            <th><label>Currículo</label></th>
            </tr>
            </thead>
            <tbody>
            <tr>
            <td class="col-num">1</td>
            <td><input type="text" placeholder="Digite o nome"></td>
            <td><input type="text" placeholder="Digite a função"></td>
            <td><input type="text" placeholder="Link ou resumo"></td>
            </tr>
            <tr>
            <td class="col-num">2</td>
            <td><input type="text" placeholder="Digite o nome"></td>
            <td><input type="text" placeholder="Digite a função"></td>
            <td><input type="text" placeholder="Link ou resumo"></td>
            </tr>
            </tbody>
            </table>
            </label>

            <button type="button" onclick="novalinha()">+ Adicionar Linha</button>
            
        </fieldset>

        <fieldset>
            <legend><h1>Sessões:</h1></legend>

            <label>
            <table id="tabeladatas">
            <thead>
            <tr>
                <th class="col-num">#</th>
                <th><label>Data:</label></th>
                <th><label>Horário:</label></th>
                <th><label>Ingressos:</label></th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td class="col-num">1</td>
                <td> <input type="date" id="datas"></td>
                <td><input type="time" id="horario"></td>
                <td><input type="text" placeholder="Solidário, Gratuito, XX,XX"></td>
            </tr>
            <tr>
                <td class="col-num">2</td>
                <td> <input type="date" id="datas"></td>
                <td><input type="time" id="horario"></td>
                <td><input type="text" placeholder="Solidário, Gratuito, XX,XX"></td>
            </tr>
            </tbody>
            </table>
            </label>

            <button type="button" onclick="novadata()">+ Adicionar Sessão</button>

            <label for="chegada">Montagem/Chegada:
                <input type="text" placeholder="Dia e horário" id="chegada" required>
            </label>

            <label for="saida">Desmontagem/Saída:
                <input type="text" placeholder="Dia e horário" id="saida" required>
            </label>
            
        </fieldset>
        
        <button type="submit" id="submit_evento">Enviar</button>

    </form>
    </main>

    <meu-footer></meu-footer>

    <script src="js/script.js"></script>
    <script src="js/customelements.js"></script>
</body>
</html>
